<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="rackBody" x1="28" y1="10" x2="92" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="rackFace" x1="34" y1="16" x2="86" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="ledGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer chassis shadow & bevel -->
  <rect x="27" y="10" width="66" height="100" rx="7" fill="url(#rackBody)" stroke="#64748B" stroke-width="1.8"/>
  <rect x="33" y="16" width="54" height="88" rx="4" fill="url(#rackFace)" stroke="#334155" stroke-width="1"/>
  <!-- 5 Server Rack Blades -->
  <g>
    <rect x="37" y="21" width="46" height="13" rx="2.5" fill="#172338" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
    <rect x="41" y="25" width="22" height="5" rx="1.2" fill="#0F172A" stroke="#475569" stroke-width="0.7"/>
    <circle cx="71" cy="27.5" r="2" fill="#38BDF8" filter="url(#ledGlow)"/>
    <circle cx="77.5" cy="27.5" r="2" fill="#10B981" filter="url(#ledGlow)"/>
  </g>
  <g>
    <rect x="37" y="37" width="46" height="13" rx="2.5" fill="#172338" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="41" y="41" width="22" height="5" rx="1.2" fill="#0F172A" stroke="#475569" stroke-width="0.7"/>
    <circle cx="71" cy="43.5" r="2" fill="#38BDF8" filter="url(#ledGlow)"/>
    <circle cx="77.5" cy="43.5" r="2" fill="#38BDF8"/>
  </g>
  <g>
    <rect x="37" y="53" width="46" height="13" rx="2.5" fill="#172338" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="41" y="57" width="22" height="5" rx="1.2" fill="#0F172A" stroke="#475569" stroke-width="0.7"/>
    <circle cx="71" cy="59.5" r="2" fill="#10B981" filter="url(#ledGlow)"/>
    <circle cx="77.5" cy="59.5" r="2" fill="#38BDF8"/>
  </g>
  <g>
    <rect x="37" y="69" width="46" height="13" rx="2.5" fill="#172338" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="41" y="73" width="22" height="5" rx="1.2" fill="#0F172A" stroke="#475569" stroke-width="0.7"/>
    <circle cx="71" cy="75.5" r="2" fill="#38BDF8" filter="url(#ledGlow)"/>
    <circle cx="77.5" cy="75.5" r="2" fill="#F59E0B"/>
  </g>
  <g>
    <rect x="37" y="85" width="46" height="13" rx="2.5" fill="#172338" stroke="#475569" stroke-width="1"/>
    <line x1="42" y1="89.5" x2="64" y2="89.5" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="42" y1="93.5" x2="58" y2="93.5" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="77.5" cy="91.5" r="2.2" fill="#38BDF8" filter="url(#ledGlow)"/>
  </g>
  <!-- Bottom feet -->
  <rect x="32" y="110" width="10" height="4" rx="1.5" fill="#475569"/>
  <rect x="78" y="110" width="10" height="4" rx="1.5" fill="#475569"/>
</svg>
