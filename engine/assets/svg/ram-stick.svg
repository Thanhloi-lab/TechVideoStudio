<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 90" fill="none">
  <defs>
    <linearGradient id="pcb" x1="8" y1="16" x2="132" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F4C5C"/>
      <stop offset="50%" stop-color="#0B2D48"/>
      <stop offset="100%" stop-color="#091E34"/>
    </linearGradient>
    <linearGradient id="goldPin" x1="0" y1="64" x2="0" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="ramGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Main PCB board with notches -->
  <path d="M12 18 H128 A4 4 0 0 1 132 22 V38 H128 V46 H132 V62 A4 4 0 0 1 128 66 H73 V60 H67 V66 H12 A4 4 0 0 1 8 62 V46 H12 V38 H8 V22 A4 4 0 0 1 12 18 Z"
        fill="url(#pcb)" stroke="#22D3EE" stroke-opacity="0.7" stroke-width="1.6"/>
  <!-- PCB top trace lines -->
  <path d="M18 24 H122" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M18 58 H122" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="1"/>
  <!-- 8 DRAM IC Chips (4 left + 4 right) -->
  <g filter="url(#ramGlow)">
    <rect x="17" y="29" width="10.5" height="24" rx="1.6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <rect x="30" y="29" width="10.5" height="24" rx="1.6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
