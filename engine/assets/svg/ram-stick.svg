    <rect x="81.5" y="66" width="3.5" height="8" rx="0.7"/>
    <rect x="87" y="66" width="3.5" height="8" rx="0.7"/>
    <rect x="92.5" y="66" width="3.5" height="8" rx="0.7"/>
    <rect x="98" y="66" width="3.5" height="8" rx="0.7"/>
