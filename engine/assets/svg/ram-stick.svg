    <rect x="56" y="29" width="10.5" height="24" rx="1.6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <rect x="74" y="29" width="10.5" height="24" rx="1.6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <rect x="87" y="29" width="10.5" height="24" rx="1.6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <rect x="100" y="29" width="10.5" height="24" rx="1.6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <rect x="113" y="29" width="10.5" height="24" rx="1.6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  </g>
  <!-- Chip inner highlight bars -->
  <g fill="#22D3EE" fill-opacity="0.35">
    <rect x="19.5" y="33" width="5.5" height="16" rx="0.8"/>
    <rect x="32.5" y="33" width="5.5" height="16" rx="0.8"/>
    <rect x="45.5" y="33" width="5.5" height="16" rx="0.8"/>
    <rect x="58.5" y="33" width="5.5" height="16" rx="0.8"/>
    <rect x="76.5" y="33" width="5.5" height="16" rx="0.8"/>
    <rect x="89.5" y="33" width="5.5" height="16" rx="0.8"/>
    <rect x="102.5" y="33" width="5.5" height="16" rx="0.8"/>
    <rect x="115.5" y="33" width="5.5" height="16" rx="0.8"/>
  </g>
  <!-- Gold edge connector pins -->
  <g fill="url(#goldPin)">
