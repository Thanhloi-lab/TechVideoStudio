<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="ssdTop" x1="20" y1="18" x2="100" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ssdStripe" x1="34" y1="26" x2="86" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <!-- 3D Isometric SSD Chassis -->
  <path d="M18 68 L64 20 L102 39 L56 88 Z" fill="url(#ssdTop)" stroke="#64748B" stroke-width="1.6"/>
  <path d="M18 68 L56 88 L56 100 L18 80 Z" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
  <path d="M56 88 L102 39 L102 51 L56 100 Z" fill="#0B1220" stroke="#475569" stroke-width="1.2"/>
  <!-- Metallic diagnostic stripe -->
  <path d="M40 53 L71 24 L82 29.5 L51 59 Z" fill="url(#ssdStripe)" fill-opacity="0.9"/>
  <path d="M53 60 L84 30.5 L88 32.5 L57 62 Z" fill="#38BDF8" fill-opacity="0.45"/>
  <!-- Corner screws + activity LED -->
  <circle cx="64" cy="25.5" r="2" fill="#94A3B8"/>
  <circle cx="96" cy="40" r="2" fill="#94A3B8"/>
  <circle cx="25" cy="68" r="2" fill="#94A3B8"/>
  <circle cx="55" cy="83" r="2.2" fill="#10B981"/>
  <!-- Gold SATA/NVMe pins on front edge -->
